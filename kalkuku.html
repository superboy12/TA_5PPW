<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkuku - Kalkulator Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f3f4f6;
        }
        .btn-calc:active {
            transform: scale(0.95);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-300 h-screen flex items-center justify-center p-4">

    <div class="flex flex-col md:flex-row gap-6 w-full max-w-4xl items-start justify-center">
        
        <div class="bg-white/80 backdrop-blur-xl border border-white/50 shadow-2xl rounded-3xl p-6 w-full max-w-xs sm:max-w-sm transition-all">
            
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-semibold text-slate-700 tracking-tight">Kalkuku</h1>
                <span id="memory-indicator" class="text-xs font-bold text-indigo-500 opacity-0 transition-opacity">M</span>
            </div>

            <div class="bg-slate-50 rounded-2xl p-4 mb-4 text-right shadow-inner border border-slate-100">
                <div id="prev-display" class="text-slate-400 text-sm h-5 overflow-hidden"></div>
                <div id="curr-display" class="text-4xl font-light text-slate-800 overflow-x-auto no-scrollbar whitespace-nowrap">0</div>
            </div>

            <div class="grid grid-cols-4 gap-2 mb-4">
                <button onclick="memoryClear()" class="text-xs font-medium text-slate-400 hover:text-red-500 transition p-2 rounded hover:bg-red-50">MC</button>
                <button onclick="memoryRecall()" class="text-xs font-medium text-slate-400 hover:text-slate-600 transition p-2 rounded hover:bg-slate-100">MR</button>
                <button onclick="memoryMinus()" class="text-xs font-medium text-slate-400 hover:text-slate-600 transition p-2 rounded hover:bg-slate-100">M-</button>
                <button onclick="memoryPlus()" class="text-xs font-medium text-slate-400 hover:text-slate-600 transition p-2 rounded hover:bg-slate-100">M+</button>
            </div>

            <div class="grid grid-cols-4 gap-3">
                <button onclick="clearEntry()" class="btn-calc bg-red-50 text-red-500 hover:bg-red-100 font-medium py-3 rounded-xl shadow-sm transition">CE</button>
                <button onclick="clearAll()" class="btn-calc bg-red-50 text-red-600 hover:bg-red-100 font-medium py-3 rounded-xl shadow-sm transition">C</button>
                <button onclick="deleteLast()" class="btn-calc bg-slate-100 text-slate-600 hover:bg-slate-200 py-3 rounded-xl shadow-sm transition">⌫</button>
                <button onclick="appendOperator('÷')" class="btn-calc bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xl font-medium py-3 rounded-xl shadow-sm transition">÷</button>

                <button onclick="appendNumber('7')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">7</button>
                <button onclick="appendNumber('8')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">8</button>
                <button onclick="appendNumber('9')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">9</button>
                <button onclick="appendOperator('×')" class="btn-calc bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xl font-medium py-3 rounded-xl shadow-sm transition">×</button>

                <button onclick="appendNumber('4')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">4</button>
                <button onclick="appendNumber('5')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">5</button>
                <button onclick="appendNumber('6')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">6</button>
                <button onclick="appendOperator('-')" class="btn-calc bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xl font-medium py-3 rounded-xl shadow-sm transition">−</button>

                <button onclick="appendNumber('1')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">1</button>
                <button onclick="appendNumber('2')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">2</button>
                <button onclick="appendNumber('3')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">3</button>
                <button onclick="appendOperator('+')" class="btn-calc bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xl font-medium py-3 rounded-xl shadow-sm transition">+</button>

                <button onclick="toggleSign()" class="btn-calc bg-white text-slate-500 hover:bg-slate-50 text-lg py-3 rounded-xl shadow-sm transition">+/-</button>
                <button onclick="appendNumber('0')" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl py-3 rounded-xl shadow-sm transition">0</button>
                <button onclick="appendDot()" class="btn-calc bg-white text-slate-700 hover:bg-slate-50 text-xl font-bold py-3 rounded-xl shadow-sm transition">.</button>
                <button onclick="calculate()" class="btn-calc bg-indigo-600 text-white hover:bg-indigo-700 text-xl font-medium py-3 rounded-xl shadow-lg shadow-indigo-200 transition">=</button>
            </div>
        </div>

        <div class="w-full md:w-64 bg-white/60 backdrop-blur-md border border-white/40 rounded-3xl p-5 shadow-lg hidden md:block h-[500px] flex flex-col">
            <div class="flex justify-between items-center mb-3 border-b border-slate-200 pb-2">
                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">History</h2>
                <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-600 transition">Hapus</button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto no-scrollbar space-y-3">
                <p class="text-center text-slate-400 text-xs mt-10 italic">Belum ada riwayat</p>
            </div>
        </div>
        
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let calculationString = '';
        let memory = 0;
        let history = [];
        let isResultDisplayed = false;

        const currDisplayEl = document.getElementById('curr-display');
        const prevDisplayEl = document.getElementById('prev-display');
        const historyListEl = document.getElementById('history-list');
        const memIndicatorEl = document.getElementById('memory-indicator');

        function updateDisplay() {
            currDisplayEl.innerText = currentInput;
            prevDisplayEl.innerText = calculationString;
        }

        function appendNumber(number) {
            if (isResultDisplayed) {
                currentInput = number;
                isResultDisplayed = false;
            } else {
                if (currentInput === '0') {
                    currentInput = number;
                } else {
                    currentInput += number;
                }
            }
            updateDisplay();
        }

        function appendDot() {
            if (isResultDisplayed) {
                currentInput = '0.';
                isResultDisplayed = false;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (isResultDisplayed) {
                isResultDisplayed = false;
                calculationString = currentInput + ' ' + op + ' ';
            } else {
                calculationString += currentInput + ' ' + op + ' ';
            }
            
            currentInput = '0';
            updateDisplay();
        }

        function toggleSign() {
            if(currentInput === '0') return;
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function deleteLast() {
            if (isResultDisplayed) {
                clearAll();
                return;
            }
            if (currentInput.length === 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function clearEntry() {
            currentInput = '0';
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            calculationString = '';
            isResultDisplayed = false;
            updateDisplay();
        }

        function calculate() {
            if (isResultDisplayed && calculationString === '') return;

            let finalExpression = calculationString + currentInput;
            let jsExpression = finalExpression.replace(/×/g, '*').replace(/÷/g, '/');

            try {
                if (jsExpression.includes('/ 0') || jsExpression.includes('/0')) {
                    throw new Error("Tak Terhingga");
                }

                let result = new Function('return ' + jsExpression)();

                if (!isFinite(result) || isNaN(result)) {
                    currentInput = "Error";
                } else {
                    result = Math.round(result * 100000000) / 100000000;
                    
                    addToHistory(finalExpression, result);
                    currentInput = result.toString();
                    calculationString = '';
                    isResultDisplayed = true;
                }
            } catch (e) {
                currentInput = "Error";
            }
            updateDisplay();
        }

        function addToHistory(expression, result) {
            history.unshift({ expr: expression, res: result });
            if (history.length > 5) history.pop();
            renderHistory();
        }

        function renderHistory() {
            historyListEl.innerHTML = '';
            if (history.length === 0) {
                historyListEl.innerHTML = '<p class="text-center text-slate-400 text-xs mt-10 italic">Belum ada riwayat</p>';
                return;
            }

            history.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-slate-50 p-3 rounded-lg border border-slate-100 fade-in cursor-pointer hover:bg-slate-100 transition';
                itemDiv.onclick = () => {
                    currentInput = item.res.toString();
                    updateDisplay();
                };
                itemDiv.innerHTML = `
                    <div class="text-xs text-slate-400 mb-1 text-right">${item.expr}</div>
                    <div class="text-lg font-semibold text-slate-700 text-right">= ${item.res}</div>
                `;
                historyListEl.appendChild(itemDiv);
            });
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        function memoryPlus() {
            memory += parseFloat(currentInput) || 0;
            toggleMemIndicator();
            isResultDisplayed = true; 
        }
        function memoryMinus() {
            memory -= parseFloat(currentInput) || 0;
            toggleMemIndicator();
            isResultDisplayed = true;
        }
        function memoryRecall() {
            currentInput = memory.toString();
            updateDisplay();
            isResultDisplayed = true; 
        }
        function memoryClear() {
            memory = 0;
            toggleMemIndicator();
        }
        function toggleMemIndicator() {
            memIndicatorEl.style.opacity = memory !== 0 ? '1' : '0';
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key;

            if (!isNaN(key)) {
                appendNumber(key);
            } else if (key === '.') {
                appendDot();
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                let op = key;
                if (key === '*') op = '×';
                if (key === '/') op = '÷';
                appendOperator(op);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearAll();
            }
        });
    </script>
</body>
</html>
